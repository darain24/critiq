name: "AI Code Review"
description: "Reviews pull request diffs using free-tier LLMs (Groq/Cerebras/Gemini)"
inputs:
  groq-api-key:
    required: false
  cerebras-api-key:
    required: false
  gemini-api-key:
    required: false
  github-token:
    required: true
    default: "${{ github.token }}"
  min-severity:
    required: false
    default: "style"
runs:
  using: "node20"
  main: "dist/index.js"
