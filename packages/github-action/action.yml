name: 'AI Code Review'
description: 'Reviews pull request diffs using free-tier LLMs (Groq/Cerebras/Gemini)'
inputs:
  groq-api-key:
    required: false
  cerebras-api-key:
    required: false
  gemini-api-key:
    required: false
  github-token:
    required: true
    default: '${{ github.token }}'
  min-severity:
    required: false
    default: 'style'
  categories:
    description: 'Comma-separated review categories: bug, security, style, performance.'
    required: false
    default: 'bug,security,style,performance'
runs:
  using: 'node24'
  main: 'dist/index.js'
